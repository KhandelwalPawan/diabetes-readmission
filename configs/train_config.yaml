data:
  raw_data_path: "data/diabetic_data.csv"
  target_variable: "readmitted"
  group_col: "patient_nbr"
  leakage_codes: [11, 12, 13, 14, 19, 20, 21]

split:
  test_size: 0.3
  random_state: 42

model:
  n_estimators: 100
  max_depth: 10
  class_weight: "balanced"
  random_state: 42
  n_jobs: -1

evaluation:
  decision_threshold: 0.50
  high_risk_threshold: 0.70

mlflow:
  experiment_name: "Diabetic Readmission Production"
  tracking_uri: null
  artifact_path: "model_pipeline"
  registered_model_name: "diabetes-readmission"

export:
  local_pipeline_path: "models/pipeline.joblib"
  metadata_path: "models/model_metadata.json"
