services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: diabetes-readmission:latest
    container_name: diabetes-readmission-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DECISION_THRESHOLD=0.50
      - HIGH_RISK_THRESHOLD=0.70
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
